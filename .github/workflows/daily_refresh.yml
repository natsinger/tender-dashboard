name: Daily Tender Refresh

on:
  schedule:
    # 10:15 Israel winter (UTC+2) every day
    - cron: "15 8 * * *"
    # 17:00 Israel winter (UTC+2) every day
    - cron: "0 15 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Tesseract OCR for scanned PDFs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-heb

      - name: Install dependencies
        run: |
          pip install requests pandas python-dotenv supabase pdfplumber playwright pytesseract pypdfium2 opencv-python-headless

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Fetch tenders and send alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP2GO_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP2GO_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          ALERT_RECIPIENTS: ${{ secrets.ALERT_RECIPIENTS }}
          TEAM_EMAIL: ${{ secrets.TEAM_EMAIL }}
        run: python scripts/refresh_tenders.py

      - name: Extract lots for watchlisted tenders (priority)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/extract_lots_batch.py --watchlist
        continue-on-error: true

      - name: Extract lot data from brochures (general batch)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/extract_lots_batch.py --limit 50
        continue-on-error: true

      - name: Extract building rights for active tenders with brochure
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/extract_building_rights_batch.py --max-per-run 20
        continue-on-error: true

      - name: Commit and push snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tenders_list_*.json
          # Only commit if there are changes
          git diff --cached --quiet || git commit -m "data: daily tender snapshot $(date +%Y-%m-%d)"
          git pull --rebase
          git push
